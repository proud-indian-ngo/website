pre-commit:
  parallel: false
  commands:
    format:
      priority: 1
      glob: "*.{js,mjs,ts,css,json}"
      # files oxfmt ignores (public/_routes.json) leave it nothing to check: not an error
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # oxlint fails when none of the files it is given are scripts, so it only gets scripts
    lint:
      priority: 2
      glob: "*.{js,mjs,ts}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    styles:
      glob: "{src/**/*.{css,astro,ts},package.json,public/*}"
      run: bun run check:design && bun run lint:css
    types:
      glob: "*.{ts,astro}"
      run: bun run check:types

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
