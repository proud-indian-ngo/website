faq:
  eyebrow: FAQ
  heading: { before: "Questions,", accent: answered. }
  items:
    - q: Is Proud Indian eligible for CSR funding?
      a: "Yes. We are registered with the Ministry of Corporate Affairs to take on CSR projects (CSR-1 {csr1}), registered under {taxExemption} and {registered}, and our accounts have been audited every year since 2019–20. See the [paperwork](#paperwork)."
    - q: Can a volunteering day count towards our CSR spend?
      a: That’s for your CSR committee to decide. Either way, we give you an invoice with the costs broken down and a report on the day.
    - q: How many people can you take?
      a: From 8 for a session with the children to around 100 for kit-building at your office. For a bigger team we split the day into batches or mix the formats.
    - q: Can we volunteer on a weekday?
      a: Yes, for kit-building at your office and for most painting days. Sessions with the children are on Saturdays and Sundays, because they’re at school during the week.
    - q: Where do volunteering days happen?
      a: Sessions with the children are at our community centre in Ibbaluru, near Bellandur. Painting days are at schools, homes and centres we work with around Bengaluru, and kit-building is at your office.
    - q: How far ahead should we plan?
      a: Three to four weeks for most days, and longer for a painting day or a Kalakriti sponsorship.
    - q: Can we do something regular, not just one day?
      a: Yes. A team can come to a class every month, or fund a programme for a year. Tell us what you have in mind and we’ll plan it with you.
    - q: Do donations get an 80G receipt?
      a: Yes. Every donation gets an {taxExemption} receipt by email; add your PAN when you donate. For receipts and invoices, write to {finance}.

