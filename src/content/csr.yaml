  eyebrow: Sponsor Kalakriti
  heading: { before: Give children a, accent: stage. }
  lede: "Once a year, children from our communities get one full day of arts and culture: eight events marked by guest judges, a stage of their own and a hall cheering them on. Every child goes home with a certificate."
  # the cost line under the tiers links the festival's own financial disclosure (reports.yaml)
  cost: "Kalakriti 3.0 cost ₹4,44,190 for 500 children, about ₹890 a child, and Kalakriti Horizon, the year of dance, music and art training before it, another ₹2,03,373. Every rupee is in the financial disclosure."
  costLink: Read the disclosure
  disclosure: /reports/disclosure-kalakriti-3-0.pdf
  tiers:
    - amount: "₹1,000"
      name: One child
      line: "Brings one child for the day: travel, lunch, materials, a medal and a certificate."
    - amount: "₹50,000"
      name: One event
      line: Sponsors one of the eight events, from rangoli to group dance, with your name on its stage and in the festival report.
    - amount: "₹4,50,000"
      name: Title sponsor
      line: Covers the whole festival, with your name on Kalakriti and on everything we put out about it.
  cta: Ask about sponsoring Kalakriti
  subject: Kalakriti sponsorship
  more: More about Kalakriti

fund:
  eyebrow: Fund a programme
  heading: { before: Where your CSR, accent: goes. }
  lede: Each programme maps to an activity in Schedule VII of the Companies Act. We agree the budget, the milestones and the reporting with you before anything starts.
  scheduleLabel: Schedule VII
  fundsLabel: Your funding pays for
  costLabel: What it cost in 2025–26
  # one row per programme, in this order. `programme` is an anchor from programmes/*.yaml (or kalakriti); `cost` is
  # from the audited accounts for 2025–26 (Bengaluru lines only) or the programme's disclosure
  rows:
    - programme: b0
      schedule: "(ii) Promoting education"
      funds: Class materials, learning kits and the weekend classes at our community centre.
      cost: ₹14,800 on learning kits, ₹12,243 on art and craft materials and ₹20,000 towards the community centre.
    - programme: b1
      schedule: "(i) Eradicating hunger and malnutrition"
      funds: Ration kits for families, and a proper meal whenever we bring the children together.
      cost: ₹37,960 on ration kits and ₹37,735 on food distribution.
    - programme: kalakriti
      schedule: "(v) Promoting art and culture"
      funds: The festival day, from the venue and travel to the medals. See the sponsorships above.
      cost: ₹4,27,936 for Kalakriti 2.0, with 450+ children.
    - programme: b3
      schedule: "(iii) Reducing inequalities faced by economically backward groups"
      funds: Gift a Smile, outings for the children, and community days.
      cost: ₹2,49,239 for Gift a Smile.
  budget: "Those are whole years, from our [audited accounts for 2025–26](/reports/audited-financials-2025-26.pdf). You can fund a programme for a year, a term or a single drive: tell us what you have in mind and we’ll send a plan with costs."
  cta: Talk to us about funding
  subject: CSR funding

drives:
  heading: Gift and kit drives
  lede: "A drive lets everyone in the company take part, not just the people who can come out for a day."
  items:
    - name: Gift a Smile
