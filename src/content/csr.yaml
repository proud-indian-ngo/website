days:
  eyebrow: Volunteering days
  heading: { before: Bring your, accent: team. }
  lede: "Pick a format and we handle the rest: the place, the materials, fitting around the children’s week, and an Optimist lead on the day."
  labels: { size: Team size, length: How long, where: Where, provide: We bring }
  formats:
    - name: A session with the children
      size: 8 to 15 people
      length: About 3 hours, on a Saturday or Sunday morning
      where: Our community centre in Ibbaluru, near Bellandur
      what: Run a maths, Spoken English or art and craft session in small groups, alongside the Optimists who teach the class every week.
      provide: The lesson plan, the materials and a briefing before you start.
    - name: Kit-building at your office
      size: 20 to 100 people
      length: 2 to 3 hours, on a weekday
      where: Your office
      what: Assemble learning, school or hygiene kits as a team. We take them to the children and tell you where they went.
      provide: Everything for the kits, and a short talk about who they’re for.
    - name: Paint a classroom or a wall
      size: 15 to 40 people
      length: A full day
      where: A school, home or centre we work with in Bengaluru
      what: Turn a bare wall into a mural, or a classroom into one with maps, numbers and the alphabet on its walls.
      provide: The site, the design, paint and tools, and someone to lead the painting.
    - name: Crew one of our big days
      size: 10 to 40 people
      length: A full day, at Kalakriti in September or Gift a Smile in December and January
      where: The festival venue, or the places we hand out gifts
      what: Run one of Kalakriti’s eight events, or help hand out the gifts children wished for at Gift a Smile.
      provide: A role for everyone, a briefing and lunch.
  cost:
    heading: What a day costs
    text: "We quote each day as the materials plus a facilitation charge, which covers the planning, the Optimist lead, getting to the site and the report afterwards. For scale: the materials for Oracle’s seed-pen day came to ₹6,550, and the paint for the wall Ethos painted to ₹20,271. You get the quote after our first call, before you commit."
  done:
    heading: Companies who have volunteered with us in Bengaluru
    items:
      - { name: Ethos, did: painted a wall at an orphanage }
      - { name: Oracle, did: made seed pens with us }
  cta: Plan a volunteering day

