# /csr/: for companies looking for a CSR partner or an employee volunteering day in Bengaluru (Bangalore).
# Decided on 2026-10-11: four offers (volunteering days, Kalakriti sponsorship, programme funding, gift and kit drives);
# four volunteering formats; Kalakriti prices from Kalakriti 2.0's costs (₹4,27,936 for 450+ children); volunteering
# days are quoted as materials plus a facilitation charge, with no per-head price on the page; enquiries by email and
# WhatsApp. Bengaluru only (the Mumbai chapter closed in 2026). Costs are from the audited accounts
# (public/reports/audited-financials-2025-26.pdf, receipts and payments) and the project disclosures; update them when
# a new year's accounts come in.
# Text may use {placeholders}: {csr1} {darpan} {taxExemption} {registered} {connect} {finance} {phone}, and the
# FAQ answers [text](url) links; email addresses become mailto links.

