      line: Children tell us what they wish for; your employees fund or buy the gifts, and we hand them over.
    - name: School kits
      when: Before the school year
      line: Bags, books and stationery for children starting a new year.
    - name: Ration kits
      when: Any time
      line: Groceries for a family’s month, packed by your team or bought through us.
  cta: Plan a drive
  subject: Gift or kit drive

how:
  eyebrow: How it works
  heading: { before: From first email to, accent: report. }
  steps:
    - title: Write to us
      line: Tell us your team size, rough dates and what you have in mind. We reply within two working days.
    - title: Plan it together
      line: A call to pick the format and the date, then a quote and the paperwork your CSR team needs.
    - title: On the day
      line: An Optimist lead meets your team, briefs everyone and runs the day with you.
    - title: The report
      line: Photos, numbers and receipts within two weeks. For CSR funding, a utilisation report as well.

safeguarding:
  eyebrow: Safeguarding
  heading: { before: Children, accent: first. }
  lede: Everyone who spends time with our children follows the same rules, whether they come with a company or on their own.
  rules:
    - Volunteers are 18 or over, and every session with children starts with a short briefing.
    - Nobody is ever alone with a child. An Optimist is always in the room.
    - We take the photos, and share only the ones we have permission to use. Please don’t photograph the children yourself.
    - No personal contact with children or their families outside our sessions, including phone numbers and social media.
    - Gifts and money go through us, never to one child, so every child gets the same.
    - Anyone who doesn’t follow the rules is asked to leave.

