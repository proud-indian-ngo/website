# /volunteer/: everything about volunteering, for people looking for weekend volunteering in Bengaluru (Bangalore).
# The sessions, the "how to join" steps and the closing come from copy.yaml (volunteer, closing) and the events feed.
# Facts confirmed on 2026-10-09: volunteers are 18 or over; a certificate or letter for hours served on request;
# internships are volunteering plus a letter; the community centre runs Spoken English classes, community programmes,
# drives and distributions.
# Text may use {placeholders}: {register} {events} {hr} {connect} {phone}. FAQ answers may also use [text](url) links;
# email addresses become mailto links.

