faq:
  eyebrow: FAQ
  heading: { before: "Questions,", accent: answered. }
  items:
    - q: Who can volunteer with Proud Indian?
      a: Anyone aged 18 or over. You don’t need a teaching background or any experience; patience and turning up matter most.
    - q: Is there a fee to volunteer?
      a: No. Volunteering with Proud Indian is free.
    - q: When are the sessions?
      a: Most are on Saturdays or Sundays. Every session’s date, time and area are listed [above](#volunteer) and on the [dashboard]({events}).
    - q: How much time do I need to give?
      a: Classes (maths, Spoken English, art and craft) run every week, so we ask class volunteers to come regularly. Drives, Gift a Smile, outings and Kalakriti are one-off days; come when you can.
    - q: Where do sessions happen?
      a: In neighbourhoods in south-east Bengaluru, around Bellandur and Iblur, and at our community centre in Ibbaluru. You get the exact meeting point once you’re approved.
    - q: How do I sign up?
      a: "[Register on the dashboard]({register}), tap “Show interest” on a session, and come along once you’re approved."
    - q: Do I get a certificate?
      a: On request. Write to {hr} and we’ll send you a certificate or letter for the hours you’ve volunteered.
    - q: Can I volunteer as an internship?
      a: Yes. Students intern by volunteering on our programmes, and get a letter for their hours at the end. [More about internships](#internships).
    - q: Can my company or group volunteer together?
      a: Yes. We run volunteering days with companies and groups. Write to {connect} to plan one.
    - q: Can I help without volunteering?
      a: You can [donate](/#donate) towards class materials, meals and Kalakriti. Every gift gets an 80G tax receipt by email.
