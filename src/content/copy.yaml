# Section copy for the one-page site, in page order. Text here was finalised on 2026-10-08; change it
# deliberately. Numbers, registrations and contacts live in site.yaml;
# programme bands in programmes/; Kalakriti in kalakriti.yaml; documents in reports.yaml; people in trustees.yaml.
# "accent" is the one highlighted word of a headline.

meta:
  title: Proud Indian · Be an Optimist
  description: Proud Indian is a volunteer-run NGO in Bengaluru. Optimists, our volunteers, run maths and English classes, art & craft, shared meals, Kalakriti and community days, mostly at weekends.

