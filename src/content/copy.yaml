volunteer:
  eyebrow: Volunteer
  heading: { before: "Your next weekend,", accent: sorted. }
  lede: Bring a few free hours and some patience; the children bring the rest. Most sessions are at weekends, and no experience is needed.
  stepsLabel: How to join
  steps:
    [Register on the dashboard, Tap “I’m interested”, "Get approved, show up"]
  join: Become an Optimist
  joinNote: Opens dash.proudindian.ngo
  poster:
    { kicker: Next up, open: Open to everyone, register: Register to join }
  posterKid:
    image: cutouts/ArtCraft_Jun2026_IMG_114811.png
    label: A boy holding up the bookmark he made in art and craft class
    crop: 507/600
  more: { heading: More weekends, link: See every session on the dashboard }
  ticketRegister: Register to join
  # the poster when the dashboard has no upcoming sessions (the "More weekends" row hides); the button links to links.register
  empty:
    label: No upcoming sessions
    heading: Nothing on the calendar yet.
    line: New sessions go up on the dashboard first. Register now and you can sign up the moment one is posted.
    register: Register on the dashboard
  # the poster when the build could not load the sessions (PUBLIC_EVENTS_URL unset, down or malformed); same layout
  # as the empty state, no sessions shown; the button links to links.register. The browser refresh replaces it.
  unavailable:
    label: Upcoming sessions are on the dashboard
    heading: Pick a weekend.
    line: Every session goes up on the dashboard first, with the date, the place and a sign-up button.
    register: See this week’s sessions

donate:
  eyebrow: Donate
  heading: { before: Fund a, accent: weekend. }
  lede: Your gift buys class materials and art supplies, food for our drives and festival lunches, and Gift a Smile gifts and outings. It also helps put on Kalakriti each year.
  kid:
    image: cutouts/Kalakriti3_IMG_4417.png
    label: A boy painting his clay pot at Kalakriti 3.0
    crop: 684/850
  facts:
    - { value: "{programmesPercent}%", label: of funds go to programmes }
    - {
        value: "{taxExemption} · {registered}",
        label: registered · receipt by email,
      }
  card:
    label: Donation amount
    choose: Choose an amount
    once: One-time
    presetsLabel: Preset amounts
    # amounts in rupees; `coins` is how many coins drop into the matka; `selected` is the default pick
    presets:
      - { amount: 500, coins: 2 }
      - { amount: 1000, coins: 3, selected: true }
      - { amount: 2500, coins: 4 }
      - { amount: 5000, coins: 5 }
    otherField: Or enter another amount
    otherPlaceholder: Any amount from 100
    otherLabel: Other amount in rupees
    total: Your gift
    minimum: Razorpay’s minimum gift is <b>₹100</b>.
    button: Donate
    # the button below the minimum (it is aria-disabled then); {min} is site.yaml → links.razorpay.min
    buttonLow: Enter ₹{min} or more
    fine: Secure payment via Razorpay · 80G receipt by email (add your PAN)

