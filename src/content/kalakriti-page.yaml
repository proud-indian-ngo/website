faq:
  eyebrow: FAQ
  heading: { before: "Questions,", accent: answered. }
  items:
    - q: When is Kalakriti?
      a: Once a year, usually on the second or third Sunday of September. Kalakriti 4.0 will be in September 2027, and we announce the date here and on Instagram.
    - q: Who takes part?
      a: "Children from our community centres and from partner learning centres across Bengaluru: 500 of them at Kalakriti 3.0. A school or centre that would like to bring its children can write to {connect}."
    - q: Does it cost anything for the children?
      a: No. We pay for the buses, lunch, the art materials, the medals and the certificates, from sponsorships and donations.
    - q: What are the eight events?
      a: Singing, solo dance, group dance, painting, pot painting, fancy dress, clay modelling and rangoli.
    - q: Who judges?
      a: Guest judges mark every event. The winners get medals and trophies, and every child who takes part gets a certificate.
    - q: What is Kalakriti Horizon?
      a: "Our year-long training for the children who stand out at the festival: weekly dance, music and art classes at their centres, studio visits and competitions outside. [More about Horizon](#horizon)."
    - q: How can I volunteer?
      a: "[Register on the dashboard]({register}) and sign up for the Kalakriti crew. No experience is needed; you get a role and a briefing before the day."
    - q: Can my company sponsor Kalakriti?
      a: "Yes: per child, per event or as the title sponsor, with the paperwork your CSR team needs. [See the sponsorships](/csr/#sponsor)."
    - q: Where does the money go?
      a: "Every edition has a financial disclosure listing each payment. At Kalakriti 3.0 the biggest costs were the buses (₹1,35,936), food (₹82,924) and the venue staff (₹65,955). [See the editions](#editions)."
