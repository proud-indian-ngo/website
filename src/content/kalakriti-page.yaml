  title: Kalakriti · Children's arts festival in Bengaluru (Bangalore) · Proud Indian
  description: "Kalakriti is Proud Indian's yearly arts festival for children in Bengaluru: one Sunday in September, eight events, 500 children and 200 volunteers. Free for every child."

