# /kalakriti/: the festival's own page, for parents, volunteers, schools, sponsors and anyone who follows a link from
# Instagram (posts link to proudindian.ngo/kalakriti). The home page's Kalakriti band (kalakriti.yaml) stays the short
# version; this is the whole story. Numbers come from each edition's financial disclosure (reports.yaml), the annual
# report for 2025-26 and the audited accounts. The sponsorship tiers are csr.yaml → kalakriti.tiers, so the two pages
# can't disagree. Text may use {placeholders} ({connect}, {register}) and [text](url) links.

