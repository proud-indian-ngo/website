faq:
  eyebrow: FAQ
  heading: { before: "Questions,", accent: answered. }
  items:
    - q: Who can teach with Proud Indian?
      a: Anyone aged 18 or over. You don’t need a teaching background or any experience; patience and turning up matter most.
    - q: What would I teach?
      a: Maths, Spoken English or art and craft, in small groups, alongside the Optimists who teach the class every week.
    - q: How much time do I need to give?
      a: Classes run every week, so we ask class volunteers to come regularly.
    - q: When and where are the classes?
      a: Most are on Saturdays or Sundays, in neighbourhoods around Bellandur and Iblur and at our community centre in Ibbaluru. Every class’s date, time and area is listed [above](#volunteer) and on the [dashboard]({events}), and you get the exact meeting point once you’re approved.
    - q: How do I sign up?
      a: "[Register on the dashboard]({register}), tap “Show interest” on a class, and come along once you’re approved."
    - q: What are the rules with the children?
      a: Every session with children starts with a short briefing, nobody is ever alone with a child, and please don’t photograph the children yourself. [Read all the safeguarding rules](/volunteer/#safeguarding).
    - q: Do I get a certificate?
      a: On request. Write to {hr} and we’ll send you a certificate or letter for the hours you’ve volunteered.
    - q: Can my company run a class with you?
      a: "Yes. A team can run a maths, Spoken English or art and craft session with the children on a Saturday or Sunday. [See the volunteering-day formats](/csr/#days)."
    - q: Can I help without volunteering?
      a: You can [donate](/#donate) towards class materials and art supplies. Every gift gets an 80G tax receipt by email.
