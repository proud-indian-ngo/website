faq:
  eyebrow: FAQ
  heading: { before: "Questions,", accent: answered. }
  items:
    - q: Who can volunteer on community days?
      a: Anyone aged 18 or over. You don’t need any experience; patience and turning up matter most.
    - q: How much time do I need to give?
      a: Gift a Smile, drives, outings and volunteering days are one-off days, so come when you can.
    - q: When is Gift a Smile?
      a: In December and January. Children tell us what they wish for, and volunteers help plan the gifts and hand them over.
    - q: When and where are the sessions?
      a: Each one’s date, time and area is listed [above](#volunteer) and on the [dashboard]({events}). Most of our Bengaluru sessions are in south-east Bengaluru, around Bellandur and Iblur, and you get the exact meeting point once you’re approved.
    - q: How do I sign up?
      a: "[Register on the dashboard]({register}), tap “Show interest” on a session, and come along once you’re approved."
    - q: Can I bring a gift for a child?
      a: Gifts and money go through us, never to one child, so every child gets the same. Gift a Smile is how children get their wishes.
    - q: What are the rules with the children?
      a: Every session with children starts with a short briefing, nobody is ever alone with a child, and please don’t photograph the children yourself. [Read all the safeguarding rules](/volunteer/#safeguarding).
    - q: Can my company volunteer together?
      a: "Yes. We run volunteering days with companies and groups: sessions with the children, kit-building at your office, painting days and crewing our big days. [See the formats and how to plan one](/csr/#days)."
    - q: Can I help without volunteering?
      a: You can [donate](/#donate) towards Gift a Smile gifts and outings. Every gift gets an 80G tax receipt by email.
