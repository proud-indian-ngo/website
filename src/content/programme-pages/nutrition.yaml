faq:
  eyebrow: FAQ
  heading: { before: "Questions,", accent: answered. }
  items:
    - q: Who can volunteer at a nutrition drive?
      a: Anyone aged 18 or over. You don’t need any experience; turning up matters most.
    - q: How much time do I need to give?
      a: Drives and distributions are one-off days, so come when you can.
    - q: When and where are the drives?
      a: Each drive’s date, time and area is listed [above](#volunteer) and on the [dashboard]({events}). Most of our Bengaluru sessions are in south-east Bengaluru, around Bellandur and Iblur, and you get the exact meeting point once you’re approved.
    - q: How do I sign up?
      a: "[Register on the dashboard]({register}), tap “Show interest” on a drive, and come along once you’re approved."
    - q: What are the rules with the children?
      a: Every session with children starts with a short briefing, nobody is ever alone with a child, and please don’t photograph the children yourself. Food and gifts go through us, never to one child, so every child gets the same. [Read all the safeguarding rules](/volunteer/#safeguarding).
    - q: Can my company run a ration-kit drive?
      a: "Yes. Your team packs groceries for a family’s month, or buys them through us, and our Optimists get them to families. [Plan a drive](/csr/#drives)."
    - q: Can I help without volunteering?
      a: You can [donate](/#donate) towards food for our drives and festival lunches. Every gift gets an 80G tax receipt by email.
