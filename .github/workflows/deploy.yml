# Build, check and deploy to Cloudflare Pages (project "proudindian" in the Proud Indian account).
#   push to main      → production deployment
#   pull request      → preview deployment (https://<branch>.proudindian.pages.dev), linked in the run summary
#   events-changed    → rebuild with fresh sessions (pi-dash can send a repository_dispatch)
#   schedule          → nightly rebuild, only once PUBLIC_EVENTS_URL is set
# Needs the repository secrets CLOUDFLARE_API_TOKEN (an account-owned token with Pages Write only) and
# CLOUDFLARE_ACCOUNT_ID (the Proud Indian account).
# PUBLIC_EVENTS_URL is a repository variable; leave it unset until the pi-dash endpoint ships.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [events-changed]
  schedule:
    - cron: "30 0 * * *" # 06:00 IST

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write

env:
  PROJECT: proudindian
  # no deploy without the Cloudflare secrets (not set up yet, or a pull request from a fork, which gets no secrets)
  CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

jobs:
  deploy:
    if: github.event_name != 'schedule' || vars.PUBLIC_EVENTS_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # optimised images (AVIF and fallbacks): the cache cuts the build from about 11s to 2s
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('src/assets/**', 'bun.lock') }}
          restore-keys: astro-

      - run: bun run check
      - run: bun run check:types
      - run: bun run build
        env:
          PUBLIC_SITE_URL: https://proudindian.ngo
          PUBLIC_EVENTS_URL: ${{ vars.PUBLIC_EVENTS_URL }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.CAN_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=${{ env.PROJECT }} --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true

      - name: Summary
        run: |
          if [ "${{ steps.deploy.outcome }}" = success ]; then
            echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built and checked; not deployed (no Cloudflare secrets)." >> "$GITHUB_STEP_SUMMARY"
          fi
