# Deletes a pull request's Cloudflare Pages preview deployments (ci.yml's "Deploy preview") once it is merged or
# closed, so https://<branch>.proudindian.pages.dev and the per-commit preview URLs stop serving. Uses the cf CLI
# (github.com/cloudflare/cf) with the same CLOUDFLARE_API_TOKEN (Pages Write) and CLOUDFLARE_ACCOUNT_ID as ci.yml.
name: Preview cleanup

on:
  pull_request:
    types: [closed]

# ci.yml's group for the branch: a preview still deploying is cancelled rather than landing after the cleanup
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  delete-previews:
    # a pull request from a fork gets no secrets, and ci.yml never deployed it
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: proudindian
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global cf@1.0.0-beta.19
      - name: Delete the branch's preview deployments
        run: |
          set -euo pipefail
          # every page first, then delete: deleting while paging would shift the pages
          ids=""
          page=1
          while :; do
            batch=$(cf pages deployments list --project-name "$PROJECT" --env preview --per-page 25 --page "$page")
            ids+=" $(jq -r --arg b "$BRANCH" '.[] | select(.deployment_trigger.metadata.branch == $b) | .id' <<< "$batch")"
            [ "$(jq length <<< "$batch")" -lt 25 ] && break
            page=$((page + 1))
          done
          n=0
          for id in $ids; do
            # --allow-aliased: the newest one carries the branch alias
            cf pages deployments delete "$id" --project-name "$PROJECT" --allow-aliased --force --quiet
            n=$((n + 1))
          done
          echo "Deleted $n preview deployment(s) for \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
