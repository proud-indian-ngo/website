# Checks, builds and deploys the site to Cloudflare Pages (project "proudindian" in the Proud Indian account), all in
# the `checks` job.
#   push to main      → checks, then a production deployment
#   pull request      → a preview deployment (https://<branch>.proudindian.pages.dev) as soon as it builds, then the
#                       browser checks
#   docs-only change  → (Markdown outside src/) no browser checks or Lighthouse; see .github/docs-only.sh
#   events-changed    → rebuild with fresh sessions (pi-dash sends this repository_dispatch when the feed changes); the
#                       code is main's, already checked, so lint, types and fallow are skipped
#   schedule          → nightly rebuild, only while PUBLIC_EVENTS_URL is set (same as events-changed)
# `checks` is the required status check on main. Secrets: CLOUDFLARE_API_TOKEN (account-owned, Pages Write only) and
# CLOUDFLARE_ACCOUNT_ID. Variable: PUBLIC_EVENTS_URL (the pi-dash public events feed).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [events-changed]
  schedule:
    - cron: "30 0 * * *" # 06:00 IST

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write
  # the preview URL is commented on pull requests
  pull-requests: write

env:
  PROJECT: proudindian
  # no deploy without the Cloudflare secrets (a pull request from a fork gets no secrets)
  CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

jobs:
  checks:
    if: github.event_name != 'schedule' || vars.PUBLIC_EVENTS_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # lint, types and fallow look at the code, which a rebuild for fresh events doesn't change
      CODE_CHECKS: ${{ github.event_name != 'repository_dispatch' && github.event_name != 'schedule' }}
      DEPLOY: pages deploy dist --project-name=proudindian --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }} --commit-dirty=true
    steps:
      - uses: actions/checkout@v7
      - id: changes
        run: .github/docs-only.sh >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: Lint
        if: env.CODE_CHECKS == 'true'
        run: bun run check
      - name: Unused code and duplication (fallow)
        if: env.CODE_CHECKS == 'true'
        run: bun run check:fallow
      # astro check runs beside the build; its result is read after the preview deploy
      - name: Start the type check
        if: env.CODE_CHECKS == 'true'
        # the outer redirect too: a background process holding the step's output open makes the step wait for it
        run: (bun run check:types > "$RUNNER_TEMP/types.log" 2>&1; echo $? > "$RUNNER_TEMP/types.exit") > /dev/null 2>&1 &
      # a renamed Razorpay item breaks the amount pre-fill: warn, but don't hold back the deploy
      - name: Razorpay pre-fill
        run: bun run check:razorpay || echo "::warning title=Razorpay::The donate page no longer pre-fills the amount; see the step log and update site.yaml → links.razorpay"

      # optimised images (AVIF and fallbacks): the cache cuts the build from about 11s to 2s
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('src/assets/**', 'bun.lock') }}
          restore-keys: astro-
      - name: Build
        run: bun run build
        env:
          PUBLIC_SITE_URL: https://proudindian.ngo
          PUBLIC_EVENTS_URL: ${{ vars.PUBLIC_EVENTS_URL }}

      # a pull request's preview goes up as soon as it builds; everything else deploys after the checks below.
      # Wrangler is a devDependency, so the action uses it instead of installing its own
      - name: Deploy preview
        id: preview
        if: env.CAN_DEPLOY == 'true' && github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ env.DEPLOY }}
      # one comment per pull request, edited on every push, so the preview link is always on the PR
      - name: Comment the preview URL
        if: steps.preview.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.deployment-url }}
          ALIAS: ${{ steps.preview.outputs.pages-deployment-alias-url }}
        run: |
          marker="<!-- preview-url -->"
          body="$marker
          **Preview:** ${ALIAS:-$URL}

          This commit (\`${SHA::7}\`): $URL"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$body"
          fi

      - name: Type check
        if: env.CODE_CHECKS == 'true'
        run: |
          for _ in $(seq 1 180); do [ -f "$RUNNER_TEMP/types.exit" ] && break; sleep 1; done
          [ -f "$RUNNER_TEMP/types.exit" ] || { cat "$RUNNER_TEMP/types.log"; echo "::error::the type check didn't finish"; exit 1; }
          cat "$RUNNER_TEMP/types.log"
          exit "$(cat "$RUNNER_TEMP/types.exit")"

      # keyed on the Playwright version, not the lockfile, so a dependency bump doesn't download the browsers again
      - name: Playwright version
        id: playwright
        if: steps.changes.outputs.docs != 'true'
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright cache
        id: playwright-cache
        if: steps.changes.outputs.docs != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.changes.outputs.docs != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Save Playwright cache
        if: always() && steps.changes.outputs.docs != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Behaviour
        if: steps.changes.outputs.docs != 'true'
        run: |
          node node_modules/astro/bin/astro.mjs preview --port 4321 --host 127.0.0.1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          bun run qa:behaviour
      - name: Margin doodles
        if: steps.changes.outputs.docs != 'true'
        run: bun run qa:doodles

      - name: Deploy
        id: deploy
        if: env.CAN_DEPLOY == 'true' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ env.DEPLOY }}
      - name: Summary
        env:
          URL: ${{ steps.preview.outputs.deployment-url || steps.deploy.outputs.deployment-url }}
          DOCS: ${{ steps.changes.outputs.docs }}
        run: |
          if [ -n "$URL" ]; then
            echo "Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Checked and built; not deployed (no Cloudflare secrets)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$DOCS" = true ]; then
            echo "Docs-only change: no browser checks." >> "$GITHUB_STEP_SUMMARY"
          fi

  # whether a pull request or push only touches docs, for the lighthouse job (checks works it out itself, so it doesn't
  # wait for this)
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - id: changes
        run: .github/docs-only.sh >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}

  # Lighthouse on the built site, beside `checks` (not required, so it never holds back a deploy); see
  # scripts/qa/lighthouse.mjs for the gates. Pull requests and pushes to main that change more than docs. Mobile and
  # desktop run on separate runners: twice as fast, and neither's measurements share a CPU with the other's.
  lighthouse:
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        form: [mobile, desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('src/assets/**', 'bun.lock') }}
          restore-keys: astro-
      - name: Build
        run: bun run build
        env:
          PUBLIC_SITE_URL: https://proudindian.ngo
          PUBLIC_EVENTS_URL: ${{ vars.PUBLIC_EVENTS_URL }}
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright cache
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # `checks` saves this cache; the runner image already has Chrome's system libraries
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium
      - name: Lighthouse
        run: bun run qa:lighthouse
        env:
          FORMS: ${{ matrix.form }}
